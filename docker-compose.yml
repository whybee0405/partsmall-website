# Parts-Mall Africa.
#
# Deliberately namespaced `partsmall-africa` so nothing here collides with the
# separate `partsmall-zic-website` project already on this machine. That gives
# distinct volumes (partsmall-africa_*), a distinct network
# (partsmall-africa_default) and explicit container names.
#
# Two services:
#   web  the Next.js site (this repository), on 127.0.0.1:3050
#   cms  CloudIA CMS: content, media, enquiries and analytics, on 127.0.0.1:8787
#
# nginx is the public edge: /admin and /api/* go to the CMS (except the site's
# own /api/enquiry, /api/chat and /api/media routes), everything else to the
# site. See nginx/parts-mall.co.za.
#
# Before 2026-11-04 the site ran Payload CMS inside `web`, with its database and
# uploads in the volumes partsmall-africa_db and partsmall-africa_media. Those
# volumes are no longer mounted but are kept for rollback; nothing here
# removes them.

name: partsmall-africa

services:
  cms:
    # The version comes from CLOUDIA_CMS_VERSION: the higher of cloudia/cms-version (the git
    # baseline) and the updater's /var/lib/cloudia-updater/partsmall/version. Updates install
    # from the dashboard through the host helper cloudia-updater; deploy with
    # ./scripts/deploy-cms.sh, and for other commands first run
    #   export CLOUDIA_CMS_VERSION=$(./scripts/deploy-cms.sh version)
    # Never start a lower version by hand.
    image: ghcr.io/whybee0405/cloudia-cms:${CLOUDIA_CMS_VERSION:?run ./scripts/deploy-cms.sh, or export CLOUDIA_CMS_VERSION=$(./scripts/deploy-cms.sh version)}
    container_name: partsmall-africa-cms
    restart: unless-stopped
    ports:
      # Loopback only: nginx forwards /admin and /api/* here.
      - '127.0.0.1:${CMS_HOST_PORT:-8787}:8787'
    env_file:
      # PUBLIC_URL, SMTP_*, FORM_SALT, TZ, BACKUP_KEEP_DAYS... (see cloudia/cms.env.example)
      - cloudia/cms.env
    environment:
      # The directory shared with the host helper cloudia-updater.
      UPDATER_DIR: /app/updater
    volumes:
      # Database and uploads.
      - cms_data:/app/data
      # cloudia.config.ts, payload-shape.json and the migration scripts.
      - ./cloudia:/app/site-config:ro
      # Backup archives. Outside /var/www/html on purpose: the default nginx
      # server publishes that folder. Must belong to uid 1000.
      - ${CMS_BACKUP_DIR:-./cms-backups}:/app/backups
      # Requests and status shared with cloudia-updater. Must belong to uid 1000.
      - ./cloudia-updater:/app/updater
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3050}
    image: partsmall-africa-web:local
    container_name: partsmall-africa-web
    restart: unless-stopped
    depends_on:
      cms:
        condition: service_healthy

    ports:
      # Nginx is the public edge for the production domain. Keep the app
      # itself private to this host.
      - '127.0.0.1:${HOST_PORT:-3050}:3000'

    environment:
      NODE_ENV: production
      # The CMS on the Compose network.
      CLOUDIA_URL: http://cms:8787
      # Read-only analytics share link (CloudIA: Analytics → Share) for the
      # public view counts on blog posts.
      CLOUDIA_ANALYTICS_SHARE_TOKEN: ${CLOUDIA_ANALYTICS_SHARE_TOKEN:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-noreply@parts-mall.co.za}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Parts-Mall Africa}
      ENQUIRY_TO_EMAIL: ${ENQUIRY_TO_EMAIL:-pma.sales1@parts-mall.com}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3050}

    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3000/robots.txt']
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  cms_data:
